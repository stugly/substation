<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report - ประวัติการปฏิบัติงาน</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
    
    
</head>

<body class="history-page">

    <div id="spinner" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.85); z-index: 9999; flex-direction: column; justify-content: center; align-items: center;">
        <div class="loader"></div>
        <div style="color: #333; font-weight: 400; margin-top: 10px;">กำลังโหลดข้อมูล...</div>
    </div>

    <div class="header">
        <h2>ประวัติการปฏิบัติงาน</h2>
    </div>

    <div class="container">
        <div class="filter-card">
            <div style="margin-bottom: 15px;">
                <label>ค้นหา (ชื่อพนักงาน / สถานี)</label>
                <input type="text" id="searchInput" placeholder="ระบุคำที่ต้องการค้นหา...">
            </div>
            
            <div class="filter-grid">
                <div>
                    <label>วันที่เริ่มต้น</label>
                    <input type="date" id="startDate">
                </div>
                <div>
                    <label>วันที่สิ้นสุด</label>
                    <input type="date" id="endDate">
                </div>
            </div>

            <button id="btnSearch">
                <i class="fa-solid fa-magnifying-glass" style="margin-right: 8px;"></i> ค้นหาข้อมูล
            </button>
        </div>

        <div class="table-card" style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th style="width: 15%;">วัน/เวลา</th>
                        <th style="width: 20%;">งาน</th>
                        <th style="width: 35%;">พนักงาน (เบอร์โทร)</th>
                        <th style="width: 30%;">สถานี / หน่วย</th>
                    </tr>
            </thead>
                <tbody id="logTable">
                    <tr><td colspan="4" style="text-align:center; padding: 30px; color: #999;">กำลังเตรียมข้อมูล...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="report.js?v=1.5"></script>
</body>
</html>

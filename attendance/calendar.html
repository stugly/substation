<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://stugly.github.io/substation/style.css">
</head>
<body class="calendar-page">
    <div id="spinner" style="display:none;"><div class="loader"></div></div>
    <div class="header"><h2>ปฏิทินการลงเวลา</h2></div>
    
    <div class="container" style="padding:15px;">
        <div class="filter-card">
            <div class="calendar-controls">
                <div class="control-group station">
                    <label>เลือกสถานี</label>
                    <select id="stationSelector" onchange="updateCalendar()"></select>
                </div>
                
                <div class="control-group">
                    <label>เดือน</label>
                    <select id="monthSelector" onchange="updateCalendar()"></select>
                </div>

                <div class="control-group">
                    <label>ปี</label>
                    <select id="yearSelector" onchange="updateCalendar()"></select>
                </div>
            </div>
        </div>

        <div class="calendar-container">
            <div class="cal-grid" id="calendarGrid">
                <div class="cal-day-head">อา</div><div class="cal-day-head">จ</div>
                <div class="cal-day-head">อ</div><div class="cal-day-head">พ</div>
                <div class="cal-day-head">พฤ</div><div class="cal-day-head">ศ</div>
                <div class="cal-day-head">ส</div>
            </div>
        </div>
    </div>
    <script src="calendar.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Helios - Smart Reporting</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://stugly.github.io/substation/style.css">
    <link rel="stylesheet" href="helios-style.css">
</head>
<body>

    <div id="spinner">
        <div class="loader"></div>
        <div id="spinner-text" style="margin-top:15px; font-family: 'Kanit'; color: #666;">กำลังเตรียมข้อมูล...</div>
    </div>

    <div class="header">
        <h2>Helios</h2>
    </div>

    <div class="container" id="main-app" style="display:none;">
        <div class="card">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div id="user-avatar-placeholder">
                    <i class="fa-solid fa-circle-user" style="font-size: 40px; color: #ccc;"></i>
                </div>
                <div id="welcome" style="font-weight:600;"></div>
            </div>
        </div>

        <div class="step-nav" style="display: flex; overflow-x: auto; white-space: nowrap; padding-bottom: 5px;">
            <div class="step-tab active" onclick="showTab(event, 'tab-1')">1.ข้อมูลหลัก</div>
            <div class="step-tab" onclick="showTab(event, 'tab-2')">2.การดำเนินงาน (มอบหมาย+แผน)</div>
            <div class="step-tab" onclick="showTab(event, 'tab-3')">3.สภาพจ่ายไฟ</div>
            <div class="step-tab" onclick="showTab(event, 'tab-4')">4.พัสดุ (ชำรุด+จัดซื้อ)</div>
            <div class="step-tab" onclick="showTab(event, 'tab-5')">5.ทำความสะอาด+วัชพืช</div>
            <div class="step-tab" onclick="showTab(event, 'tab-6')">6.บุคคลภายนอก (WP)</div>
            <div class="step-tab" onclick="showTab(event, 'tab-7')">7.ทรัพย์สิน</div>
            <div class="step-tab" onclick="showTab(event, 'tab-8')">8.KM/สร้างสรรค์</div>
            <div class="step-tab" onclick="showTab(event, 'tab-9')">9.สรุปการลา</div>
            <div class="step-tab" onclick="showTab(event, 'tab-10')">10.รปภ.</div>
            <div class="step-tab" onclick="showTab(event, 'tab-11')">11.อื่นๆ</div>
        </div>

        <form id="reportForm">
            <div class="card">
                <div style="text-align: center; padding-bottom: 15px; border-bottom: 2px solid #06C755; margin-bottom: 15px;">
                    <h3 id="report-title" style="margin: 0; color: #333; font-size: 16px; font-weight: 600;">รายงานการประชุมประจำเดือน</h3>
                    <input type="hidden" id="unit" name="unit">
                    <input type="hidden" id="month" name="month">
                </div>
                <div class="input-row-grid">
                    <div class="form-compact"><label>วันที่ประชุม</label><input type="date" name="meeting_date" id="meeting_date" required></div>
                    <div class="form-compact"><label>เวลา</label><input type="time" name="start_time" id="start_time" required></div>
                    <div class="form-compact"><label>สถานที่ประชุม</label><select id="location" name="location" required></select></div>
                    <div class="form-compact"><label>วิธีการประชุม</label>
                        <select name="method">
                            <option value="On-site">On-site</option>
                            <option value="Online">Online</option>
                        </select>
                    </div>
                </div>
                <hr style="border:0; border-top:1px solid #eee; margin:20px 0;">
                <label style="font-weight:600; color:#06C755;"><i class="fa-solid fa-users"></i> ผู้เข้าประชุม</label>
                <div id="attendance-list" class="check-list" style="margin-top:10px;"></div>
                <hr style="border:0; border-top:1px solid #eee; margin:20px 0;">
                <label style="font-weight:600; color:#06C755;"><i class="fa-solid fa-camera"></i> รูปภาพประกอบ</label>
                <input type="file" id="imageInput" accept="image/*" multiple onchange="handleImageSelect(this)" style="margin-top:10px;">
                <div id="image-preview" class="preview-img-container"></div>
            </div>

            <div class="card" style="margin-bottom:15px;">
                <label style="color:#06C755; font-weight:600;"><i class="fa-solid fa-thumbtack"></i> 1. งานที่ได้รับมอบหมาย</label>
                <div id="assignment-container"></div>
                <button type="button" id="btn-add-assignment" onclick="addTaskRow('assignment')" class="btn-add-dynamic">+ เพิ่มงานมอบหมาย</button>
            </div>
            <div class="card" style="margin-bottom:15px;">
                <label style="color:#06C755; font-weight:600;"><i class="fa-solid fa-calendar-check"></i> 2. แผนงานประจำเดือน</label>
                <div id="plan-container"></div>
                <button type="button" id="btn-add-plan" onclick="addTaskRow('plan')" class="btn-add-dynamic">+ เพิ่มแผนงาน</button>
            </div>

            <div class="card" style="margin-bottom:15px;">
                <label style="color:#06C755; font-weight:600;"><i class="fa-solid fa-bolt"></i> 3. สภาพการจ่ายไฟฟ้า</label>
                <div id="power-container"></div>
                <button type="button" id="btn-add-power" onclick="addPowerDynamicRow()" class="btn-add-dynamic">+ เพิ่มสถานี</button>
            </div>

            <div class="card" style="margin-bottom:15px;">
                <label style="color:#06C755; font-weight:600;"><i class="fa-solid fa-tools"></i> 4. รายงานอุปกรณ์ชำรุด</label>
                <div id="repair-container"></div>
                <button type="button" id="btn-add-repair" onclick="addRepairRow()" class="btn-add-dynamic">+ เพิ่มรายการชำรุด</button>
            </div>
            <div class="card" style="margin-bottom:15px;">
                <label style="color:#06C755; font-weight:600;"><i class="fa-solid fa-cart-shopping"></i> 5. งานจัดซื้อจัดจ้าง</label>
                <div id="procure-container"></div>
                <button type="button" id="btn-add-procure" onclick="addTaskRow('procure')" class="btn-add-dynamic">+ เพิ่มรายการจัดซื้อ</button>
            </div>

            <div class="card" style="margin-bottom:15px;">
                <label style="color:#06C755; font-weight:600;"><i class="fa-solid fa-broom"></i> 6. รายงานการทำความสะอาด</label>
                <div id="clean-container"></div>
                <button type="button" id="btn-add-clean" onclick="addTaskRow('clean')" class="btn-add-dynamic">+ เพิ่มรายการ</button>
            </div>
            <div class="card" style="margin-bottom:15px;">
                <label style="color:#06C755; font-weight:600;"><i class="fa-solid fa-leaf"></i> 7. รายงานการกำจัดวัชพืช</label>
                <div id="weed-container"></div>
                <button type="button" id="btn-add-weed" onclick="addTaskRow('weed')" class="btn-add-dynamic">+ เพิ่มรายการ</button>
            </div>

            <input type="hidden" name="recorder_uid" id="recorder_uid">
            <button type="submit" id="btn-submit" class="btn-primary" style="width: 100%; margin: 20px 0 50px 0;">
                ✅ บันทึกรายงานทั้งหมด
            </button>
</form>
    </div>

    <script>
        function showTab(evt, tabId) {
            const contents = document.getElementsByClassName("tab-content");
            for (let i = 0; i < contents.length; i++) contents[i].style.display = "none";
            document.getElementById(tabId).style.display = "block";
            const tabs = document.getElementsByClassName("step-tab");
            for (let i = 0; i < tabs.length; i++) tabs[i].classList.remove("active");
            evt.currentTarget.classList.add("active");
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
    <script src="script.js?v=12.0"></script>
</body>
</html>

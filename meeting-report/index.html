<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Argus - Meeting</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://stugly.github.io/substation/style.css">
    
    <style>
        /* ส่วนที่ CSS หลักของคุณไม่มี คือ "ที่คั่นแฟ้ม" จึงต้องใส่เพิ่มนิดหน่อยครับ */
        .step-nav { display: flex; padding: 0 10px; gap: 2px; margin-top: 20px; }
        .step-tab { flex: 1; height: 35px; background: #e9ecef; border-radius: 10px 10px 0 0; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #888; cursor: pointer; border: 1px solid #ddd; border-bottom: none; }
        .step-tab.active { background: #fff; color: #06C755; font-weight: 600; border-top: 3px solid #06C755; height: 40px; margin-top: -5px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        /* ปรับ Container ให้รับกับ CSS หลักของคุณ */
        .container { margin-top: -30px; }
    </style>
</head>
<body>

    <div id="spinner">
        <div class="loader"></div>
        <div>กำลังประมวลผล...</div>
    </div>

    <div class="header">
        <h2>Argus</h2>
    </div>

    <div class="container" id="main-app" style="display:none;">
        <div class="card">
            <div style="display: flex; align-items: center; gap: 10px;">
                <img id="profileImg" src="" style="width:45px; height:45px; border-radius:50%; display:none;">
                <div id="welcome" style="font-weight:600;">สวัสดี, กำลังโหลด...</div>
            </div>
        </div>

        <div class="step-nav">
            <div class="step-tab active" onclick="showTab(event, 'tab-1')">1.ข้อมูล</div>
            <div class="step-tab" onclick="showTab(event, 'tab-2')">2.ผลงาน</div>
            <div class="step-tab" onclick="showTab(event, 'tab-3')">3.อุปกรณ์</div>
            <div class="step-tab" onclick="showTab(event, 'tab-4')">4.ภารกิจ</div>
            <div class="step-tab" onclick="showTab(event, 'tab-5')">5.รูปภาพ</div>
        </div>

        <form id="reportForm">
            <div id="tab-1" class="tab-content active">
                <div class="card">
                    <label class="form-label">หน่วยงาน</label>
                    <select id="unit" name="unit"></select>
                </div>
            </div>
            </form>
    </div>

    <script src="script.js?v=5.8"></script>
</body>
</html>

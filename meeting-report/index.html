<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Helios - Smart Reporting</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://stugly.github.io/substation/style.css">
    <link rel="stylesheet" href="helios-style.css">
</head>
<body>

    <div id="spinner">
        <div class="loader"></div>
        <div id="spinner-text" style="margin-top:15px; font-family: 'Kanit'; color: #666;">กำลังเตรียมข้อมูล...</div>
    </div>

    <div class="header">
        <h2>Helios</h2>
    </div>

    <div class="container" id="main-app" style="display:none;">
        <div class="card">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div id="user-avatar-placeholder">
                    <i class="fa-solid fa-circle-user" style="font-size: 40px; color: #ccc;"></i>
                </div>
                <div id="welcome" style="font-weight:600;"></div>
            </div>
        </div>

        <form id="reportForm">
            <div class="card">
                <div style="text-align: center; padding-bottom: 15px; border-bottom: 2px solid #06C755; margin-bottom: 15px;">
                    <h3 id="report-title" style="margin: 0; color: #333; font-size: 16px; font-weight: 600;">รายงานการประชุมประจำเดือน</h3>
                    <input type="hidden" id="unit" name="unit">
                    <input type="hidden" id="month" name="month">
                </div>
                <div class="input-row-grid">
                    <div class="form-compact"><label>วันที่ประชุม</label><input type="date" name="meeting_date" id="meeting_date" required></div>
                    <div class="form-compact"><label>เวลา</label><input type="time" name="start_time" id="start_time" required></div>
                    <div class="form-compact"><label>สถานที่ประชุม</label><select id="location" name="location" required></select></div>
                    <div class="form-compact"><label>วิธีการประชุม</label>
                        <select name="method">
                            <option value="On-site">On-site</option>
                            <option value="Online">Online</option>
                        </select>
                    </div>
                </div>
                <hr style="border:0; border-top:1px solid #eee; margin:20px 0;">
                <label style="font-weight:600; color:#06C755;"><i class="fa-solid fa-users"></i> ผู้เข้าประชุม</label>
                <div id="attendance-list" class="check-list-grid">
                    <div class="attendance-column">
                        <div class="column-header-mini">เจ้าหน้าที่ในสังกัด</div>
                        <div id="unit-staff-list"></div>
                    </div>
                    <div class="attendance-column">
                        <div class="column-header-mini">เจ้าหน้าที่ ผจฟ.1</div>
                        <div id="pj-staff-list"></div>
                    </div>
                </div>
                <hr style="border:0; border-top:1px solid #eee; margin:20px 0;">
                <label style="font-weight:600; color:#06C755;"><i class="fa-solid fa-camera"></i> รูปภาพประกอบ</label>
                <input type="file" id="imageInput" accept="image/*" multiple onchange="handleImageSelect(this)" style="margin-top:10px;">
                <div id="image-preview" class="preview-img-container"></div>
            </div>

            <div class="card">
                <label style="color:#06C755; font-weight:600;"><i class="fa-solid fa-thumbtack"></i> 1. งานที่ได้รับมอบหมาย</label>
                <div id="assignment-container"></div>
                <button type="button" id="btn-add-assignment" onclick="addTaskRow('assignment')" class="btn-add-dynamic">+ เพิ่มงานมอบหมาย</button>
            </div>

            <div class="card">
                <label style="color:#06C755; font-weight:600;"><i class="fa-solid fa-calendar-check"></i> 2. แผนงานประจำเดือน</label>
                <div id="plan-container"></div>
                <button type="button" id="btn-add-plan" onclick="addTaskRow('plan')" class="btn-add-dynamic">+ เพิ่มแผนงาน</button>
            </div>

            <div class="card" id="power-station-container">
                <label style="color:#06C755; font-weight:600;"><i class="fa-solid fa-bolt"></i> 3. สภาพการจ่ายไฟฟ้า</label>
                <div id="power-container"></div>
                <button type="button" id="btn-add-power" onclick="addPowerDynamicRow()" class="btn-add-dynamic">+ เพิ่มสถานี</button>
            </div>

            <div class="card" id="repair-tasks-container">
                <label style="color:#06C755; font-weight:600;"><i class="fa-solid fa-tools"></i> 4. รายงานอุปกรณ์ชำรุด</label>
                <div id="repair-container"></div>
                <button type="button" id="btn-add-repair" onclick="addRepairRow()" class="btn-add-dynamic">+ เพิ่มรายการชำรุด</button>
            </div>

            <div class="card" id="procure-container-main">
                <label style="color:#06C755; font-weight:600;"><i class="fa-solid fa-cart-shopping"></i> 5. งานจัดซื้อจัดจ้าง</label>
                <div id="procure-container"></div>
                <button type="button" id="btn-add-procure" onclick="addProcureRow()" class="btn-add-dynamic">+ เพิ่มรายการจัดซื้อ</button>
            </div>

            <div class="card" id="clean-weed-section">
                <div class="input-row-grid" style="grid-template-columns: 1fr 1fr; gap: 20px; align-items: flex-start;">
                    <div id="clean-column">
                        <label style="color:#06C755; font-weight:600; display: block; margin-bottom: 10px;">
                            <i class="fa-solid fa-broom"></i> 6. รายงานทำความสะอาด
                        </label>
                        <table class="fixed-report-table">
                            <thead>
                                <tr>
                                    <th style="width: 25%;">ครั้งที่</th>
                                    <th style="width: 35%;">วันที่</th>
                                    <th style="width: 40%;">สรุปผล</th>
                                </tr>
                            </thead>
                            <tbody id="clean-table-body">
                                <tr>
                                    <td>1/<span class="current-year"></span></td>
                                    <td><input type="date" name="clean_date[]" oninput="this.setAttribute('value', this.value)" style="font-family: inherit;"></td>
                                    <td><input type="text" name="clean_detail[]" placeholder="..."></td>
                                </tr>
                                <tr>
                                    <td>2/<span class="current-year"></span></td>
                                    <td><input type="date" name="clean_date[]" oninput="this.setAttribute('value', this.value)" style="font-family: inherit;"></td>
                                    <td><input type="text" name="clean_detail[]" placeholder="..."></td>
                                </tr>
                                <tr>
                                    <td>3/<span class="current-year"></span></td>
                                    <td><input type="date" name="clean_date[]" oninput="this.setAttribute('value', this.value)" style="font-family: inherit;"></td>
                                    <td><input type="text" name="clean_detail[]" placeholder="..."></td>
                                </tr>
                                <tr>
                                    <td>4/<span class="current-year"></span></td>
                                    <td><input type="date" name="clean_date[]" oninput="this.setAttribute('value', this.value)" style="font-family: inherit;"></td>
                                    <td><input type="text" name="clean_detail[]" placeholder="..."></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div id="weed-column">
                        <label style="color:#06C755; font-weight:600; display: block; margin-bottom: 10px;">
                            <i class="fa-solid fa-leaf"></i> 7. รายงานกำจัดวัชพืช
                        </label>
                        <table class="fixed-report-table">
                            <thead>
                                <tr>
                                    <th style="width: 25%;">ครั้งที่</th>
                                    <th style="width: 35%;">วันที่</th>
                                    <th style="width: 40%;">สรุปผล</th>
                                </tr>
                            </thead>
                            <tbody id="weed-table-body">
                                <tr><td>1/<span class="current-year"></span></td><td><input type="date" name="weed_date[]" oninput="this.setAttribute('value', this.value)" style="font-family: inherit;"></td><td><input type="text" name="weed_detail[]" placeholder="..."></td></tr>
                                <tr><td>2/<span class="current-year"></span></td><td><input type="date" name="weed_date[]" oninput="this.setAttribute('value', this.value)" style="font-family: inherit;"></td><td><input type="text" name="weed_detail[]" placeholder="..."></td></tr>
                                <tr><td>3/<span class="current-year"></span></td><td><input type="date" name="weed_date[]" oninput="this.setAttribute('value', this.value)" style="font-family: inherit;"></td><td><input type="text" name="weed_detail[]" placeholder="..."></td></tr>
                                <tr><td>4/<span class="current-year"></span></td><td><input type="date" name="weed_date[]" oninput="this.setAttribute('value', this.value)" style="font-family: inherit;"></td><td><input type="text" name="weed_detail[]" placeholder="..."></td></tr>
                                <tr><td>5/<span class="current-year"></span></td><td><input type="date" name="weed_date[]" oninput="this.setAttribute('value', this.value)" style="font-family: inherit;"></td><td><input type="text" name="weed_detail[]" placeholder="..."></td></tr>
                                <tr><td>6/<span class="current-year"></span></td><td><input type="date" name="weed_date[]" oninput="this.setAttribute('value', this.value)" style="font-family: inherit;"></td><td><input type="text" name="weed_detail[]" placeholder="..."></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="card" id="external-work-section">
                <label style="color:#06C755; font-weight:600;"><i class="fa-solid fa-user-gear"></i> 8. การปฏิบัติงานของบุคคลภายนอก</label>
                <div id="external-container"></div>
                <button type="button" id="btn-add-external" onclick="addExternalRow()" class="btn-add-dynamic">+ เพิ่มรายการปฏิบัติงาน</button>
            </div>

            <div class="card" id="asset-section">
                <label style="color:#06C755; font-weight:600;"><i class="fa-solid fa-boxes-stacked"></i> 9. ทรัพย์สิน</label>
                <div id="asset-container"></div>
                <button type="button" id="btn-add-asset" onclick="addAssetRow()" class="btn-add-dynamic">+ เพิ่มรายการทรัพย์สิน</button>
            </div>

            <div class="card">
                <label style="color:#06C755; font-weight:600;"><i class="fa-solid fa-lightbulb"></i> 10. การจัดการองค์ความรู้ (KM)</label>
                <div id="km-container"></div>
                <button type="button" id="btn-add-km" onclick="addSimpleTaskRow('km')" class="btn-add-dynamic">+ เพิ่มรายการ KM</button>
            </div>

            <div class="card">
                <label style="color:#06C755; font-weight:600;"><i class="fa-solid fa-wand-magic-sparkles"></i> 11. ความคิดสร้างสรรค์</label>
                <div id="idea-container"></div>
                <button type="button" id="btn-add-idea" onclick="addSimpleTaskRow('idea')" class="btn-add-dynamic">+ เพิ่มรายการความคิดสร้างสรรค์</button>
            </div>

            <div class="card">
                <label style="color:#06C755; font-weight:600; display: block; margin-bottom: 10px;"><i class="fa-solid fa-user-slash"></i> 12. สรุปการลาประจำเดือน</label>
                <div style="overflow-x: auto;">
                    <table class="fixed-report-table" style="min-width: 600px;">
                        <thead>
                            <tr>
                                <th style="width: 25%;">ชื่อ-สกุล</th>
                                <th style="width: 10%;">ลาป่วย</th>
                                <th style="width: 10%;">ลากิจ</th>
                                <th style="width: 10%;">ลาพักผ่อน</th>
                                <th style="width: 10%;">ปฏิบัติงานแทน</th>
                                <th style="width: 35%;">หมายเหตุ</th>
                            </tr>
                        </thead>
                        <tbody id="leave-table-body">
                            </tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <label style="color:#06C755; font-weight:600;"><i class="fa-solid fa-shield-halved"></i> 13. รายงานการตรวจสอบ รปภ.</label>
                <div id="security-container" style="margin-top: 12px;"></div>
            </div>

            <div class="card">
                <label style="color:#06C755; font-weight:600;"><i class="fa-solid fa-ellipsis"></i> 14. เรื่องอื่นๆ</label>
                <div id="other-container"></div>
                <button type="button" id="btn-add-other" onclick="addSimpleTaskRow('other')" class="btn-add-dynamic">+ เพิ่มเรื่องอื่นๆ</button>
            </div>

            <input type="hidden" name="recorder_uid" id="recorder_uid">
            <button type="submit" id="btn-submit" class="btn-primary" style="width: 100%; margin: 20px 0 50px 0;">
                ✅ บันทึกรายงานทั้งหมด
            </button>
        </form>
    </div>

    <script src="script.js?v=13.0"></script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Helios</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://stugly.github.io/substation/style.css">
    <style>
      #spinner { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #fff; position: fixed; width: 100%; z-index: 9999; top:0; left:0; }
      .loader { border: 4px solid #f3f3f3; border-top: 4px solid #06C755; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

      #user-avatar-placeholder { width: 45px; height: 45px; border-radius: 50%; overflow: hidden; background: #eee; display: flex; align-items: center; justify-content: center; }
      #user-avatar-placeholder img { width: 100%; height: 100%; object-fit: cover; }
      
      .step-nav { display: flex; padding: 0 10px; gap: 4px; margin-top: 20px; }
      .step-tab { flex: 1; height: 35px; background: #eee; border-radius: 10px 10px 0 0; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #888; cursor: pointer; border: 1px solid #ddd; border-bottom: none; transition: 0.2s; }
      .step-tab.active { background: #fff; color: #06C755; font-weight: 600; border-top: 3px solid #06C755; height: 40px; margin-top: -5px; }
      
      .tab-content { display: none; }
      .tab-content.active { display: block; }
      .check-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px; border: 1px solid #eee; border-radius: 10px; max-height: 200px; overflow-y: auto; }
      
      .preview-img-container { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
      .preview-img-container img { width: 65px; height: 65px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd; }

      .input-group-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .form-inline { display: flex; align-items: center; gap: 8px; }
      .form-inline label { flex: 0 0 auto; white-space: nowrap; font-size: 13px; margin-bottom: 0 !important; color: #555; }
      .form-inline input, .form-inline select { flex: 1; padding: 6px !important; border: 1px solid #ddd !important; border-radius: 5px !important; font-size: 13px !important; height: 35px !important; }
    </style>
</head>
<body>

    <div id="spinner">
        <div class="loader"></div>
        <div id="spinner-text" style="margin-top:15px; font-family: 'Kanit'; color: #666;">กำลังเตรียมข้อมูล...</div>
    </div>

    <div class="header">
        <h2>Helios</h2>
    </div>

    <div class="container" id="main-app" style="display:none;">
        <div class="card">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div id="user-avatar-placeholder">
                    <i class="fa-solid fa-circle-user" style="font-size: 40px; color: #ccc;"></i>
                </div>
                <div id="welcome" style="font-weight:600;"></div>
            </div>
        </div>

        <div class="step-nav">
            <div class="step-tab active" onclick="showTab(event, 'tab-1')">1.ข้อมูลหลัก</div>
            <div class="step-tab" onclick="showTab(event, 'tab-2')">2.ดำเนินงาน</div>
            <div class="step-tab" onclick="showTab(event, 'tab-3')">3.เทคนิค/ซ่อม</div>
            <div class="step-tab" onclick="showTab(event, 'tab-4')">4.พัสดุ/อื่นๆ</div>
        </div>

        <form id="reportForm">
            <div id="tab-1" class="tab-content active">
                <div class="card">
                    <div style="text-align: center; padding-bottom: 20px; border-bottom: 2px solid #06C755; margin-bottom: 20px;">
                        <h3 id="report-title" style="margin: 0; color: #333; font-size: 18px; font-weight: 600;">กำลังเตรียมข้อมูล...</h3>
                        <input type="hidden" id="unit" name="unit">
                        <input type="hidden" id="month" name="month">
                    </div>

                    <div class="input-group-grid">
                        <div class="form-inline">
                            <label>วันที่</label>
                            <input type="date" name="meeting_date" id="meeting_date" required>
                        </div>
                        <div class="form-inline">
                            <label>เวลา</label>
                            <input type="time" name="start_time" id="start_time" required>
                        </div>
                        <div class="form-inline">
                            <label>สถานที่</label>
                            <select id="location" name="location" required></select>
                        </div>
                        <div class="form-inline">
                            <label>วิธีประชุม</label>
                            <select name="method">
                                <option value="On-site">On-site</option>
                                <option value="Online">Online</option>
                                <option value="Hybrid">Hybrid</option>
                            </select>
                        </div>
                    </div>

                    <hr style="border: 0; border-top: 1px solid #eee; margin: 25px 0;">

                    <label class="form-label" style="font-weight: 600; color: #06C755; font-size: 15px;">
                        <i class="fa-solid fa-users"></i> รายชื่อผู้เข้าประชุม
                    </label>
                    <div id="attendance-list" class="check-list" style="margin-top: 10px;"></div>

                    <hr style="border: 0; border-top: 1px solid #eee; margin: 25px 0;">

                    <label class="form-label" style="font-weight: 600; color: #06C755; font-size: 15px;">
                        <i class="fa-solid fa-camera"></i> รูปภาพประกอบรายงาน
                    </label>
                    <div style="margin-top: 10px;">
                        <input type="file" id="imageInput" accept="image/*" multiple onchange="handleImageSelect(this)" style="font-size: 13px;">
                        <div id="image-preview" class="preview-img-container"></div>
                    </div>
                </div>
            </div>

            <div id="tab-2" class="tab-content">
                <div class="card">
                    <label class="form-label">สรุปผลการดำเนินงาน / ความปลอดภัย</label>
                    <textarea name="op_detail" rows="10" placeholder="กรอกรายละเอียด..."></textarea>
                </div>
            </div>

            <div id="tab-3" class="tab-content">
                <div class="card">
                    <label class="form-label">รายการอุปกรณ์ชำรุด / Site Maintenance</label>
                    <div id="eq-container"></div>
                    <button type="button" class="btn-secondary" style="width:100%; margin-top:10px;" onclick="addEqRow()">+ เพิ่มรายการอุปกรณ์</button>
                    <textarea name="site_detail" rows="5" style="margin-top:15px;" placeholder="รายละเอียดบำรุงรักษาพื้นที่..."></textarea>
                </div>
            </div>

            <div id="tab-4" class="tab-content">
                <div class="card">
                    <label class="form-label">ภารกิจมอบหมาย / แผนงานเดือนถัดไป</label>
                    <div id="task-container"></div>
                    <button type="button" class="btn-secondary" style="width:100%; margin-top:10px;" onclick="addTaskRow()">+ เพิ่มภารกิจ</button>
                </div>
                <div class="card">
                    <label class="form-label">พัสดุ / ทรัพย์สิน / ข้อมูลอื่นๆ</label>
                    <textarea name="other_detail" rows="6" placeholder="ระบุข้อมูลเพิ่มเติม..."></textarea>
                </div>
            </div>

            <input type="hidden" name="recorder_uid" id="recorder_uid">
            <input type="hidden" name="recorder_line" id="recorder_line">
            
            <button type="submit" id="btn-submit" class="btn-primary" style="width: 100%; margin-top: 20px; margin-bottom: 50px;">
                ✅ บันทึกรายงานทั้งหมด
            </button>
        </form>
    </div>

    <script>
        function showTab(evt, tabId) {
            const contents = document.getElementsByClassName("tab-content");
            for (let i = 0; i < contents.length; i++) contents[i].style.display = "none";
            document.getElementById(tabId).style.display = "block";

            const tabs = document.getElementsByClassName("step-tab");
            for (let i = 0; i < tabs.length; i++) tabs[i].classList.remove("active");
            evt.currentTarget.classList.add("active");
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
    <script src="script.js?v=6.7"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Argus</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://stugly.github.io/substation/style.css">
    <style>
        /* ใส่เพิ่มแค่ส่วน Tab เท่านั้นที่ใน CSS เดิมไม่มี */
        .step-nav { display: flex; padding: 0 10px; gap: 4px; margin-top: 20px; }
        .step-tab { flex: 1; height: 35px; background: #eee; border-radius: 10px 10px 0 0; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #888; cursor: pointer; border: 1px solid #ddd; border-bottom: none; }
        .step-tab.active { background: #fff; color: #06C755; font-weight: 600; border-top: 3px solid #06C755; height: 40px; margin-top: -5px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .check-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px; border: 1px solid #eee; border-radius: 10px; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>

    <div id="spinner">
        <div class="loader"></div>
        <div>กำลังประมวลผล...</div>
    </div>

    <div class="header">
        <h2>Argus</h2>
    </div>

    <div class="container" id="main-app" style="display:none;">
        
        <div class="card">
            <div style="display: flex; align-items: center; gap: 10px;">
                <div id="user-avatar-placeholder">
                    <i class="fa-solid fa-circle-user" style="font-size: 45px; color: #ccc;"></i>
                </div>
                <div id="welcome" style="font-weight:600;"></div>
            </div>
        </div>

        <div class="step-nav">
            <div class="step-tab active" onclick="showTab(event, 'tab-1')">1.หลัก</div>
            <div class="step-tab" onclick="showTab(event, 'tab-2')">2.งาน</div>
            <div class="step-tab" onclick="showTab(event, 'tab-3')">3.ซ่อม</div>
            <div class="step-tab" onclick="showTab(event, 'tab-4')">4.แผน</div>
            <div class="step-tab" onclick="showTab(event, 'tab-5')">5.รูป</div>
        </div>

        <form id="reportForm">
            <div id="tab-1" class="tab-content active">
                <div class="card">
                    <label class="form-label">หน่วยงาน</label>
                    <select id="unit" name="unit" required></select>
                    <label class="form-label" style="margin-top:10px;">เดือนที่รายงาน</label>
                    <select id="month" name="month" required></select>
                </div>
                <div class="card">
                    <label class="form-label">รายชื่อผู้เข้าประชุม</label>
                    <div id="attendance-list" class="check-list"></div>
                </div>
            </div>

            <div id="tab-2" class="tab-content">
                <div class="card">
                    <label class="form-label">สรุปผลดำเนินงาน</label>
                    <textarea name="op_detail" rows="10"></textarea>
                </div>
            </div>
            
            <input type="hidden" name="recorder_uid" id="recorder_uid">
            <input type="hidden" name="recorder_line" id="recorder_line">
            
            <button type="submit" id="btn-submit" class="btn-primary" style="width: 100%; margin-top: 20px; margin-bottom: 50px;">
                ✅ บันทึกรายงานทั้งหมด
            </button>
        </form>
    </div>

    <script>
        function showTab(evt, tabId) {
            const contents = document.getElementsByClassName("tab-content");
            for (let i = 0; i < contents.length; i++) contents[i].style.display = "none";
            document.getElementById(tabId).style.display = "block";
            const tabs = document.getElementsByClassName("step-tab");
            for (let i = 0; i < tabs.length; i++) tabs[i].classList.remove("active");
            evt.currentTarget.classList.add("active");
        }
    </script>
    <script src="script.js?v=5.8"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monthly Meeting Report</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stugly.github.io/substation/style.css">
    <style>
        /* ตัวหมุนรอขณะโหลด เหมือน Argus */
        #spinner { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #fff; position: fixed; width: 100%; z-index: 999; }
        .tab-content { display: none; background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #eee; margin-top: 10px; }
        .tab-content.active { display: block; }
        .preview-container img { width: 70px; height: 70px; object-fit: cover; border-radius: 5px; margin: 5px; }
        .check-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #f9f9f9; padding: 10px; border-radius: 8px; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>

    <div id="spinner">
        <div class="loader"></div>
        <div style="margin-top:15px;">กำลังตรวจสอบสิทธิ์...</div>
    </div>

    <div id="main-app" class="container" style="display:none;">
        <div class="header">
            <h2>Meeting Report</h2>
            <div id="welcome" style="font-size: 14px; font-weight: 600; color: #28a745;"></div>
        </div>

        <div class="tab-nav" style="display: flex; overflow-x: auto; gap: 5px; margin-bottom: 10px;">
            <button class="tab-btn active" onclick="showTab(event, 'tab-general')">1. General</button>
            <button class="tab-btn" onclick="showTab(event, 'tab-op')">2. Operation</button>
            <button class="tab-btn" onclick="showTab(event, 'tab-maint')">3. Maint</button>
            <button class="tab-btn" onclick="showTab(event, 'tab-task')">4. Task/Plan</button>
            <button class="tab-btn" onclick="showTab(event, 'tab-pics')">5. Pics</button>
        </div>

        <form id="reportForm">
            <div id="tab-general" class="tab-content active">
                <div class="card">
                    <label>หน่วยงาน</label>
                    <select name="unit" id="unit" required></select>
                    <label>เดือน</label>
                    <select name="month" id="month" required></select>
                    <label>วันที่ประชุม</label>
                    <input type="date" name="date" required>
                </div>
                <div class="card">
                    <label>รายชื่อผู้เข้าประชุม (Attendance)</label>
                    <div id="attendance-list" class="check-list"></div>
                </div>
            </div>

            <div id="tab-op" class="tab-content">
                <div class="card">
                    <label>สรุปผลการดำเนินงาน</label>
                    <textarea name="op_detail" rows="4"></textarea>
                </div>
            </div>

            <div id="tab-maint" class="tab-content">
                <div class="card">
                    <div id="eq-container"></div>
                    <button type="button" class="btn-secondary" style="width:100%" onclick="addEqRow()">+ เพิ่มอุปกรณ์ชำรุด</button>
                </div>
            </div>

            <div id="tab-task" class="tab-content">
                <div class="card">
                    <div id="task-container"></div>
                    <button type="button" class="btn-secondary" style="width:100%" onclick="addTaskRow()">+ เพิ่มภารกิจ/แผนงาน</button>
                </div>
            </div>

            <div id="tab-pics" class="tab-content">
                <div class="card">
                    <label>แนบรูปภาพ (สร้าง Folder อัตโนมัติ)</label>
                    <input type="file" id="imageInput" accept="image/*" multiple onchange="handleImageSelect(this)">
                    <div id="image-preview" class="preview-container"></div>
                </div>
                <input type="hidden" name="recorder_uid" id="recorder_uid">
                <input type="hidden" name="recorder_line" id="recorder_line">
            </div>

            <button type="submit" id="btn-submit" class="btn-primary" style="width: 100%; margin-top: 20px; font-size: 18px;">
                ✅ บันทึกรายงานทั้งหมด
            </button>
        </form>
    </div>

    <script src="script.js?v=1.0"></script>
</body>
</html>

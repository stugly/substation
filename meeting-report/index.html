<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Helios</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://stugly.github.io/substation/style.css">
    <link rel="stylesheet" href="helios-style.css">
    <link rel="icon" href="data:,">
</head>
<body>

    <div id="spinner">
        <div class="loader"></div>
        <div id="spinner-text" style="margin-top:15px; font-family: 'Kanit'; color: #666;">กำลังเตรียมข้อมูล...</div>
    </div>

    <div class="header">
        <h2>Helios</h2>
    </div>

    <div class="container" id="main-app" style="display:none;">
        <div class="card">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div id="user-avatar-placeholder">
                    <i class="fa-solid fa-circle-user" style="font-size: 40px; color: #ccc;"></i>
                </div>
                <div id="welcome" style="font-weight:600;"></div>
            </div>
        </div>

        <div class="step-nav">
            <div class="step-tab active" onclick="showTab(event, 'tab-1')">1.ข้อมูลหลัก</div>
            <div class="step-tab" onclick="showTab(event, 'tab-2')">2.การดำเนินงาน</div>
            <div class="step-tab" onclick="showTab(event, 'tab-3')">3.สภาพการจ่ายไฟ</div>
            <div class="step-tab" onclick="showTab(event, 'tab-4')">4.อุปกรณ์ชำรุด</div>
            <div class="step-tab" onclick="showTab(event, 'tab-5')">5.จัดซื้อจัดจ้าง</div>
            <div class="step-tab" onclick="showTab(event, 'tab-6')">6.ทำความสะอาด/กำจัดวัชพืช</div>
        </div>

        <form id="reportForm">
            <div id="tab-1" class="tab-content active">
                <div class="card">
                    <div style="text-align: center; padding-bottom: 15px; border-bottom: 2px solid #06C755; margin-bottom: 15px;">
                        <h3 id="report-title" style="margin: 0; color: #333; font-size: 16px; font-weight: 600;">กำลังเตรียมข้อมูล...</h3>
                        <input type="hidden" id="unit" name="unit">
                        <input type="hidden" id="month" name="month">
                    </div>

                    <div class="input-row-grid">
                        <div class="form-compact">
                            <label>วันที่ประชุม</label>
                            <input type="date" name="meeting_date" id="meeting_date" required>
                        </div>
                        <div class="form-compact">
                            <label>เวลา</label>
                            <input type="time" name="start_time" id="start_time" required>
                        </div>
                        <div class="form-compact">
                            <label>สถานที่ประชุม</label>
                            <select id="location" name="location" required></select>
                        </div>
                        <div class="form-compact">
                            <label>วิธีการประชุม</label>
                            <select name="method">
                                <option value="On-site">On-site</option>
                                <option value="Online">Online</option>
                            </select>
                        </div>
                    </div>

                    <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
                    <label class="form-label" style="font-weight: 600; color: #06C755; font-size: 14px;">
                        <i class="fa-solid fa-users"></i> รายชื่อผู้เข้าประชุม
                    </label>
                    <div id="attendance-list" class="check-list" style="margin-top: 10px;"></div>

                    <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
                    <label class="form-label" style="font-weight: 600; color: #06C755; font-size: 14px;">
                        <i class="fa-solid fa-camera"></i> รูปภาพประกอบรายงาน
                    </label>
                    <div style="margin-top: 10px;">
                        <input type="file" id="imageInput" accept="image/*" multiple onchange="handleImageSelect(this)" style="font-size: 12px;">
                        <div id="image-preview" class="preview-img-container"></div>
                    </div>
                </div>
            </div>

            <div id="tab-2" class="tab-content">
                <div class="card" style="margin-bottom: 15px;">
                    <label class="form-label" style="color: #06C755; font-weight: 600; font-size: 14px;">
                        <i class="fa-solid fa-thumbtack"></i> 🚩 งานที่ได้รับมอบหมาย
                    </label>
                    <div id="assignment-container"></div>
                    <button type="button" id="btn-add-assignment" onclick="addTaskRow('assignment')" class="btn-secondary" 
                            style="width: 100%; margin-top: 10px; font-size: 13px; height: 32px; border: 1px dashed #d9534f; color: #d9534f; background: #fff5f5;">
                        <i class="fa-solid fa-plus"></i> เพิ่มงาน
                    </button>
                </div>

                <div class="card">
                    <label class="form-label" style="color: #06C755; font-weight: 600; font-size: 14px;">
                        <i class="fa-solid fa-calendar-check"></i> 📅 แผนงานดำเนินงานประจำเดือน
                    </label>
                    <div id="plan-container"></div>
                    <button type="button" id="btn-add-plan" onclick="addTaskRow('plan')" class="btn-secondary" 
                            style="width: 100%; margin-top: 10px; font-size: 13px; height: 32px; border: 1px dashed #06C755; color: #06C755; background: #f0fdf4;">
                        <i class="fa-solid fa-plus"></i> เพิ่มงาน
                    </button>
                </div>
            </div>

            <div id="tab-3" class="tab-content">
                <div class="card">
                    <label class="form-label" style="font-weight: 600; color: #06C755; font-size: 14px;">
                        <i class="fa-solid fa-bolt"></i> รายละเอียดการเปลี่ยนแปลงสภาพการจ่ายไฟ
                    </label>
                    
                    <div id="power-fixed-container"></div>
                    
                    <hr style="border: 0; border-top: 1px dashed #ddd; margin: 15px 0;">
                    
                    <div id="power-dynamic-container"></div>
                    
                    <button type="button" id="btn-add-power" onclick="addPowerDynamicRow()" class="btn-secondary" 
                            style="width: 100%; margin-top: 10px; font-size: 13px; height: 35px; border: 1px dashed #06C755; color: #06C755; background: #f0fdf4;">
                        <i class="fa-solid fa-plus"></i> เพิ่มรายการ
                    </button>
                </div>
            </div>

            <div id="tab-4" class="tab-content">
                <div class="card">
                    <label class="form-label" style="font-weight: 600; color: #d9534f; font-size: 14px;">
                        <i class="fa-solid fa-tools"></i> รายการอุปกรณ์ชำรุด / การบำรุงรักษา
                    </label>
                    <div id="repair-container"></div>
                    <button type="button" id="btn-add-repair" onclick="addTaskRow('repair')" class="btn-secondary" 
                            style="width: 100%; margin-top: 10px; font-size: 13px; height: 32px; border: 1px dashed #d9534f; color: #d9534f; background: #fff5f5;">
                        <i class="fa-solid fa-plus"></i> เพิ่มรายการชำรุด
                    </button>
                </div>
            </div>

            <div id="tab-5" class="tab-content">
                <div class="card">
                    <label class="form-label" style="font-weight: 600; color: #f39c12; font-size: 14px;">
                        <i class="fa-solid fa-cart-shopping"></i> งานจัดซื้อจัดจ้าง / พัสดุ
                    </label>
                    <div id="procure-container"></div>
                    <button type="button" id="btn-add-procure" onclick="addTaskRow('procure')" class="btn-secondary" 
                            style="width: 100%; margin-top: 10px; font-size: 13px; height: 32px; border: 1px dashed #f39c12; color: #f39c12; background: #fffcf5;">
                        <i class="fa-solid fa-plus"></i> เพิ่มรายการพัสดุ
                    </button>
                </div>
            </div>

            <div id="tab-6" class="tab-content">
                <div class="card">
                    <label class="form-label" style="font-weight: 600; color: #06C755; font-size: 14px;">
                        <i class="fa-solid fa-broom"></i> งานทำความสะอาด / กำจัดวัชพืช
                    </label>
                    <div id="clean-container"></div>
                    <button type="button" id="btn-add-clean" onclick="addTaskRow('clean')" class="btn-secondary" 
                            style="width: 100%; margin-top: 10px; font-size: 13px; height: 32px; border: 1px dashed #06C755; color: #06C755; background: #f0fdf4;">
                        <i class="fa-solid fa-plus"></i> เพิ่มรายการทำความสะอาด
                    </button>
                </div>
            </div>

            <input type="hidden" name="recorder_uid" id="recorder_uid">
            <input type="hidden" name="recorder_line" id="recorder_line">
            
            <button type="submit" id="btn-submit" class="btn-primary" style="width: 100%; margin-top: 20px; margin-bottom: 50px;">
                ✅ บันทึกรายงานทั้งหมด
            </button>
        </form>
    </div>

    <script>
        function showTab(evt, tabId) {
            const contents = document.getElementsByClassName("tab-content");
            for (let i = 0; i < contents.length; i++) contents[i].style.display = "none";
            document.getElementById(tabId).style.display = "block";

            const tabs = document.getElementsByClassName("step-tab");
            for (let i = 0; i < tabs.length; i++) tabs[i].classList.remove("active");
            evt.currentTarget.classList.add("active");
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
    <script src="script.js?v=8.6"></script>
</body>
</html>

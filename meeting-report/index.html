<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monthly Meeting Report</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://stugly.github.io/substation/style.css">
    
    <style>
        * { font-family: 'Kanit', sans-serif !important; }
        #spinner { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #fff; position: fixed; width: 100%; z-index: 9999; top:0; left:0; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .step-nav { display: flex; justify-content: space-around; margin: 15px 0; }
        .step-circle { 
            width: 42px; height: 42px; border-radius: 50%; border: 2px solid #ddd; 
            background: #fff; font-weight: 600; color: #888; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .step-circle.active { background: #28a745 !important; color: #fff !important; border-color: #28a745 !important; }
        
        /* สไตล์รายชื่อพนักงาน 2 คอลัมน์ */
        .check-list { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px; 
            padding: 10px; border: 1px solid #eee; border-radius: 10px; 
            max-height: 200px; overflow-y: auto; background: #fdfdfd;
        }
        .check-list label { font-size: 14px; font-weight: 300; display: flex; align-items: center; gap: 5px; }
        .preview-img-container { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
        .preview-img-container img { width: 75px; height: 75px; object-fit: cover; border-radius: 8px; border: 1px solid #eee; }
    </style>
</head>
<body>

    <div id="spinner">
        <div class="loader"></div>
        <div id="spinner-text" style="margin-top:15px;">กำลังตรวจสอบสิทธิ์...</div>
        <div id="spinner-action" style="margin-top: 20px;"></div>
    </div>

    <div id="main-app" style="display:none;">
        <div class="header">
            <h2>Meeting Report</h2>
        </div>

        <div class="container">
            <div class="card">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <i class="fa-solid fa-circle-user" style="font-size: 24px; color: #28a745;"></i>
                    <div id="welcome" style="font-weight:600;"></div>
                </div>
            </div>

            <div class="step-nav">
                <div class="step-circle active" onclick="showTab(event, 'tab-general', '1. ข้อมูลทั่วไป')">1</div>
                <div class="step-circle" onclick="showTab(event, 'tab-op', '2. ผลดำเนินงาน')">2</div>
                <div class="step-circle" onclick="showTab(event, 'tab-maint', '3. บำรุงรักษา')">3</div>
                <div class="step-circle" onclick="showTab(event, 'tab-task', '4. ภารกิจ/แผน')">4</div>
                <div class="step-circle" onclick="showTab(event, 'tab-pics', '5. รูปภาพ')">5</div>
            </div>

            <h3 id="current-tab-title" style="margin: 10px 5px; color: #28a745; font-size: 18px;">
                1. ข้อมูลทั่วไป
            </h3>

            <form id="reportForm">
                <div id="tab-general" class="tab-content active">
                    <div class="card">
                        <label class="form-label">หน่วยงาน</label>
                        <select id="unit" name="unit" required></select>
                        <label class="form-label">เดือน</label>
                        <select id="month" name="month" required></select>
                    </div>
                    <div class="card">
                        <label class="form-label">ผู้เข้าประชุม (Attendance)</label>
                        <div id="attendance-list" class="check-list"></div>
                    </div>
                </div>

                <div id="tab-op" class="tab-content">
                    <div class="card">
                        <label class="form-label">สรุปผลการดำเนินงาน</label>
                        <textarea name="op_detail" rows="10" placeholder="กรอกรายละเอียด..."></textarea>
                    </div>
                </div>

                <div id="tab-maint" class="tab-content">
                    <div class="card">
                        <label class="form-label">รายการอุปกรณ์ชำรุด</label>
                        <div id="eq-container"></div>
                        <button type="button" class="btn-secondary" style="width:100%; margin-top:10px;" onclick="addEqRow()">+ เพิ่มอุปกรณ์</button>
                    </div>
                </div>

                <div id="tab-task" class="tab-content">
                    <div class="card">
                        <label class="form-label">ภารกิจมอบหมาย/แผนงาน</label>
                        <div id="task-container"></div>
                        <button type="button" class="btn-secondary" style="width:100%; margin-top:10px;" onclick="addTaskRow()">+ เพิ่มแผนงาน</button>
                    </div>
                </div>

                <div id="tab-pics" class="tab-content">
                    <div class="card">
                        <label class="form-label">รูปภาพประกอบ</label>
                        <input type="file" id="imageInput" accept="image/*" multiple onchange="handleImageSelect(this)">
                        <div id="image-preview" class="preview-img-container"></div>
                    </div>
                </div>

                <input type="hidden" name="recorder_uid" id="recorder_uid">
                <input type="hidden" name="recorder_line" id="recorder_line">

                <button type="submit" id="btn-submit" class="btn-primary" style="width: 100%; margin: 25px 0 50px 0;">
                    ✅ บันทึกรายงานทั้งหมด
                </button>
            </form>
        </div>
    </div>

    <script src="script.js?v=2.1"></script>
</body>
</html>
